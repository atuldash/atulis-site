name: Fetch photos
on:
  push:
    paths: [".github/workflows/images.yml", "photos.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and resize from Google Drive
        run: |
          pip install pillow
          mkdir -p img
          python - <<'PY'
          import io, urllib.request
          from PIL import Image, ImageOps
          for line in open("photos.txt"):
              parts = line.split()
              if len(parts) != 3:
                  continue
              name, fid, width = parts[0], parts[1], int(parts[2])
              url = f"https://drive.usercontent.google.com/download?id={fid}&export=download&confirm=t"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = urllib.request.urlopen(req, timeout=120).read()
              print(name, len(data), data[:12])
              im = ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert("RGB")
              if im.width > width:
                  im = im.resize((width, round(im.height * width / im.width)), Image.LANCZOS)
              im.save(f"img/{name}.jpg", "JPEG", quality=80, optimize=True, progressive=True)
          PY
          ls -la img
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Add resized photos from Drive"
          git push
