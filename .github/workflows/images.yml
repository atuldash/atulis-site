name: Fetch photos
on:
  push:
    paths: [".github/workflows/images.yml", "photos.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and resize from Google Drive
        run: |
          mkdir -p img
          while read -r name id width; do
            [ -z "$name" ] && continue
            curl -sSL "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" -o "/tmp/${name}.src"
            file "/tmp/${name}.src"
            convert "/tmp/${name}.src" -auto-orient -resize "${width}x>" -strip -interlace Plane -quality 80 "img/${name}.jpg"
          done < photos.txt
          ls -la img
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Add resized photos from Drive"
          git push
